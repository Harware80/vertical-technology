<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | VERTICAL TECHNOLOGY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#0b1220;
color:white;
padding:40px;
}

.login-box,
.dashboard{

max-width:1200px;
margin:auto;
background:#121c2f;
padding:40px;
border-radius:25px;
margin-top:40px;

}

h1{
margin-bottom:30px;
color:#00b7ff;
}

input,
textarea{

width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:12px;
background:#0b1220;
color:white;

}

button{

padding:15px 25px;
border:none;
border-radius:12px;
background:#00b7ff;
color:white;
font-weight:700;
cursor:pointer;
margin-top:10px;

}

.dashboard{
display:none;
}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;

}

.card{

background:#0b1220;
padding:25px;
border-radius:20px;

}

.admin-product{

background:#0f172a;
padding:20px;
border-radius:20px;
margin-top:20px;

}

.admin-product img{

height:220px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;

}

</style>

</head>

<body>

<!-- LOGIN -->

<div class="login-box" id="loginSection">

<h1>
Administrador
</h1>

<input
type="email"
id="adminEmail"
placeholder="Correo administrador"
>

<input
type="password"
id="adminPassword"
placeholder="Contraseña"
>

<button onclick="loginAdmin()">
Iniciar Sesión
</button>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboardSection">

<h1>
Dashboard Empresarial
</h1>

<button onclick="logoutAdmin()">
Cerrar Sesión
</button>

<br><br>

<div class="grid">

<div class="card">

<h2>
Agregar Producto
</h2>

<br>

<input
type="text"
id="productName"
placeholder="Nombre producto"
>

<input
type="number"
id="productPrice"
placeholder="Precio"
>

<textarea
id="productDescription"
placeholder="Descripción"
></textarea>

<input
type="file"
id="productImage"
>

<button onclick="addProduct()">
Guardar Producto
</button>

</div>

<div class="card">

<h2>
Inventario
</h2>

<div id="productsList"></div>

</div>

</div>

</div>

<!-- MODULE -->

<script type="module" src="./js/admin.js"></script>

</body>

</html>
