<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Administrativo | VERTICAL TECHNOLOGY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#081120;
color:white;
padding:40px;
}

/* LOGIN */

#loginScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#081120;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:#111c33;
padding:40px;
border-radius:25px;
width:90%;
max-width:420px;
}

.login-box h1{
color:#00b7ff;
margin-bottom:30px;
text-align:center;
}

input,
textarea{
width:100%;
padding:18px;
margin-bottom:20px;
border:none;
border-radius:12px;
background:#0b1528;
color:white;
font-size:16px;
}

button{
padding:18px 30px;
border:none;
border-radius:14px;
background:#00b7ff;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#0095d4;
}

/* PANEL */

.panel{
max-width:1200px;
margin:auto;
}

.main-title{
font-size:52px;
margin-bottom:40px;
color:#00b7ff;
}

.card{
background:#111c33;
padding:35px;
border-radius:25px;
margin-bottom:30px;
}

.card h2{
margin-bottom:25px;
font-size:32px;
color:#00b7ff;
}

.product{
background:#0b1528;
padding:20px;
border-radius:20px;
margin-top:20px;
display:flex;
gap:20px;
align-items:center;
}

.product img{
width:140px;
height:140px;
object-fit:cover;
border-radius:15px;
}

.product-info{
flex:1;
}

.product-info h3{
font-size:28px;
margin-bottom:10px;
}

.product-info p{
margin-bottom:10px;
color:#d7d7d7;
}

.price{
font-size:26px;
font-weight:800;
color:#00b7ff;
}

.delete-btn{
background:#ff3d3d;
margin-top:15px;
}

.delete-btn:hover{
background:#cf2f2f;
}

.logout-btn{
margin-bottom:30px;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="login-box">

<h1>
ADMIN LOGIN
</h1>

<input
type="email"
id="email"
placeholder="Correo administrador"
>

<input
type="password"
id="password"
placeholder="Contraseña"
>

<button onclick="login()">
Entrar
</button>

</div>

</div>

<!-- PANEL -->

<div class="panel">

<h1 class="main-title">
Panel Empresarial
</h1>

<button class="logout-btn" onclick="logout()">
Cerrar Sesión
</button>

<div class="card">

<h2>
Agregar Producto
</h2>

<input
type="text"
id="name"
placeholder="Nombre producto"
>

<input
type="text"
id="price"
placeholder="Precio"
>

<textarea
id="description"
placeholder="Descripción"
></textarea>

<input
type="text"
id="image"
placeholder="URL imagen GitHub"
>

<button onclick="saveProduct()">
Guardar Producto
</button>

</div>

<div class="card">

<h2>
Inventario
</h2>

<div id="products"></div>

</div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCFuqPFMI66oc7sKMBTWAtJTUkvuCScubs",

authDomain: "vertical-technology-592c7.firebaseapp.com",

projectId: "vertical-technology-592c7",

storageBucket: "vertical-technology-592c7.appspot.com",

messagingSenderId: "852661748457",

appId: "1:852661748457:web:61438c40c89ec5843ce678"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const auth = firebase.auth();

/* =========================
AUTH
========================= */

auth.onAuthStateChanged(user=>{

if(user){

document.getElementById("loginScreen")
.style.display="none";

}else{

document.getElementById("loginScreen")
.style.display="flex";

}

});

function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)

.then(()=>{

alert("Bienvenido Administrador");

})

.catch((error)=>{

alert(error.message);

});

}

function logout(){

auth.signOut();

}

/* =========================
PRODUCTOS
========================= */

async function saveProduct(){

const name =
document.getElementById('name').value;

const price =
document.getElementById('price').value;

const description =
document.getElementById('description').value;

const image =
document.getElementById('image').value;

if(!name || !price || !description || !image){

alert("Completa todos los campos");

return;

}

await db.collection("productos").add({

name,
price,
description,
image,
created: Date.now()

});

alert("Producto guardado");

document.getElementById('name').value="";
document.getElementById('price').value="";
document.getElementById('description').value="";
document.getElementById('image').value="";

loadProducts();

}

async function deleteProduct(id){

await db.collection("productos")
.doc(id)
.delete();

loadProducts();

}

async function loadProducts(){

const products =
document.getElementById('products');

products.innerHTML = "";

const snapshot =
await db.collection("productos").get();

snapshot.forEach(doc=>{

const product = doc.data();

products.innerHTML += `

<div class="product">

<img src="${product.image}">

<div class="product-info">

<h3>${product.name}</h3>

<p>${product.description}</p>

<div class="price">
$${product.price} MXN
</div>

<button
class="delete-btn"
onclick="deleteProduct('${doc.id}')">

Eliminar

</button>

</div>

</div>

`;

});

}

loadProducts();

</script>

</body>

</html>
