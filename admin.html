<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | VERTICAL TECHNOLOGY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#0b1220;
color:white;
padding:40px;
}

.login-box,
.panel{
max-width:500px;
margin:auto;
background:#121c2f;
padding:40px;
border-radius:25px;
margin-top:50px;
}

h1{
text-align:center;
margin-bottom:30px;
color:#00b7ff;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:12px;
background:#0b1220;
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00b7ff;
color:white;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

.panel{
display:none;
}

.card{
background:#0b1220;
padding:25px;
border-radius:20px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<input type="email" id="email" placeholder="Correo administrador">

<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">
Iniciar Sesión
</button>

</div>

<div class="panel" id="panel">

<h1>Panel Administrativo</h1>

<div class="card">
<h2>Gestión de Cotizaciones</h2>
<p>Administración de solicitudes y clientes.</p>
</div>

<div class="card">
<h2>Inventario</h2>
<p>Administración de refacciones y componentes.</p>
</div>

<div class="card">
<h2>Técnicos</h2>
<p>Gestión de empleados y servicios.</p>
</div>

<div class="card">
<h2>Configuración Web</h2>
<p>Modificación visual y administrativa.</p>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "AIzaSyCFuqPFMI66oc7sKMBTWAtJTUkvuCScubs",

authDomain: "vertical-technology-592c7.firebaseapp.com",

projectId: "vertical-technology-592c7",

storageBucket: "vertical-technology-592c7.firebasestorage.app",

messagingSenderId: "852661748457",

appId: "1:852661748457:web:61438c40c89ec5843ce678",

measurementId: "G-CRRH733QK7"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

async function login(){

const email=document.getElementById('email').value;

const password=document.getElementById('password').value;

try{

await auth.signInWithEmailAndPassword(email,password);

document.querySelector('.login-box').style.display='none';

document.getElementById('panel').style.display='block';

alert('Bienvenido administrador');

}catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
