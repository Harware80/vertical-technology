<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Refacciones | VERTICAL TECHNOLOGY</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#081120;
color:white;
}

header{
padding:25px 40px;
background:#050b16;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:800;
color:#00b7ff;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
padding:50px;
}

.card{
background:#111c33;
border-radius:25px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-content{
padding:25px;
}

.card h3{
font-size:28px;
margin-bottom:15px;
}

.card p{
color:#d7d7d7;
margin-bottom:15px;
line-height:1.6;
}

.price{
font-size:30px;
font-weight:800;
color:#00b7ff;
margin-bottom:20px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:14px;
background:#00b7ff;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}

button:hover{
background:#0095d4;
}

#cart{
position:fixed;
right:20px;
top:120px;
width:350px;
background:#111c33;
padding:25px;
border-radius:25px;
max-height:80vh;
overflow:auto;
}

.cart-item{
margin-bottom:15px;
padding-bottom:15px;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.total{
font-size:28px;
font-weight:800;
margin-top:20px;
color:#00b7ff;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#081120;
color:white;
}

@media(max-width:900px){

#cart{
position:relative;
width:90%;
margin:30px auto;
top:auto;
right:auto;
}

.products{
padding:20px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
VERTICAL TECHNOLOGY
</div>

<a href="index.html" style="color:white;text-decoration:none;">
Volver
</a>

</header>

<div class="products" id="products"></div>

<div id="cart">

<h2 style="margin-bottom:20px;color:#00b7ff;">
Cotización
</h2>

<div id="cartItems"></div>

<div class="total" id="total">
$0 MXN
</div>

<input type="text" id="clientName" placeholder="Nombre">

<input type="email" id="clientEmail" placeholder="Correo">

<input type="tel" id="clientPhone" placeholder="Teléfono">

<button onclick="sendQuote()">
Solicitar Cotización
</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCFuqPFMI66oc7sKMBTWAtJTUkvuCScubs",
authDomain: "vertical-technology-592c7.firebaseapp.com",
projectId: "vertical-technology-592c7",
storageBucket: "vertical-technology-592c7.appspot.com",
messagingSenderId: "852661748457",
appId: "1:852661748457:web:61438c40c89ec5843ce678"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let cart = [];

async function loadProducts(){

const productsDiv = document.getElementById('products');

productsDiv.innerHTML = "";

const snapshot = await db.collection("productos").get();

snapshot.forEach(doc=>{

const product = doc.data();

productsDiv.innerHTML += `

<div class="card">

<img src="${product.image}">

<div class="card-content">

<h3>${product.name}</h3>

<p>${product.description}</p>

<div class="price">
$${product.price} MXN
</div>

<button onclick="addToCart('${product.name}','${product.price}')">
Agregar al carrito
</button>

</div>

</div>

`;

});

}

function addToCart(name,price){

cart.push({
name,
price
});

renderCart();

}

function renderCart(){

const cartItems = document.getElementById('cartItems');

cartItems.innerHTML = "";

let total = 0;

cart.forEach(item=>{

cartItems.innerHTML += `

<div class="cart-item">

<strong>${item.name}</strong><br>

$${item.price} MXN

</div>

`;

total += Number(item.price);

});

document.getElementById('total').innerHTML = `$${total} MXN`;

}

function sendQuote(){

const name = document.getElementById('clientName').value;
const email = document.getElementById('clientEmail').value;
const phone = document.getElementById('clientPhone').value;

let products = "";

cart.forEach(item=>{

products += `${item.name} - $${item.price} MXN%0D%0A`;

});

const body = `Cliente: ${name}%0D%0A
Correo: ${email}%0D%0A
Telefono: ${phone}%0D%0A%0D%0A
Productos:%0D%0A${products}`;

window.location.href =
`mailto:luxascensores@gmail.com?subject=Cotizacion Refacciones&body=${body}`;

}

loadProducts();

</script>

</body>
</html>
